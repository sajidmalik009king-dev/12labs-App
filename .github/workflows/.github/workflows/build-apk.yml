# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:name: Build 12Labs APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget

      - name: Extract 12Labs project
        run: |
          unzip -o "12labs-buildready.zip" -d extracted
          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Find Android project
        run: |
          ANDROID_DIR=$(find extracted -type f -name "settings.gradle.kts" -o -name "settings.gradle" | head -1 | xargs -r dirname)
          if [ -z "$ANDROID_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Android project: $ANDROID_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Generate Gradle wrapper if needed
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          ./gradlew clean :app:assembleDebug --stacktrace

      - name: Find APK
        run: |
          find extracted -type f -name "*.apk" -print

      - name: Rename APK
        run: |
          APK=$(find extracted -type f -path "*/build/outputs/apk/debug/*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "APK was not produced"
            exit 1
          fi
          cp "$APK" "12Labs.apk"
          ls -lh 12Labs.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 12Labs-APK
          path: 12Labs.apk
          if-no-files-found: error
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
